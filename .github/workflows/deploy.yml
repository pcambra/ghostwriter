name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install the site at the commit the VM runs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git checkout --quiet "$BEFORE" || git checkout --quiet HEAD^
          composer install --no-interaction --no-progress
          cp web/sites/default/default.settings.php web/sites/default/settings.php
          printf '%s\n' "\$settings['config_sync_directory'] = '../config/sync';" "\$settings['file_private_path'] = '../private';" >> web/sites/default/settings.php
          mkdir -p db
          vendor/bin/drush site:install --existing-config --db-url=sqlite://localhost/../db/ci.sqlite -y
          git checkout --quiet "$GITHUB_SHA"

      - name: Install this commit's dependencies
        run: composer install --no-interaction --no-progress

      - name: Coding standards
        run: vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,install,inc,yml web/modules/custom/ghostwriter

      - name: Static analysis
        run: vendor/bin/phpstan analyse -c web/modules/custom/ghostwriter/phpstan.neon --no-progress --memory-limit=1G

      - name: Kernel tests
        run: SIMPLETEST_DB="sqlite://localhost/$RUNNER_TEMP/test.sqlite" vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/ghostwriter/tests

      - name: Deploy this commit to that site
        run: vendor/bin/drush deploy -y

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TARGET: pcambra@ghostwriter.cueleb.re
    steps:
      - uses: actions/checkout@v7

      - name: No empty patches
        run: test -z "$(find patches -type f -empty)"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload site and custom modules
        run: rsync -azR --delete composer.json composer.lock patches.lock.json patches recipes config web/modules/custom "$TARGET:ghostwriter/"

      - name: Update Drupal
        run: ssh "$TARGET" 'cd ~/ghostwriter && composer install --no-dev --no-interaction && vendor/bin/drush deploy -y'
