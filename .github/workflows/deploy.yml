name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: pcambra@ghostwriter.cueleb.re
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload module
        run: rsync -az --delete --exclude=.git --exclude=.github ./ "$TARGET:ghostwriter/web/modules/custom/ghostwriter/"

      - name: Update Drupal
        run: ssh "$TARGET" 'cd ~/ghostwriter && vendor/bin/drush updatedb -y && vendor/bin/drush cache:rebuild'
